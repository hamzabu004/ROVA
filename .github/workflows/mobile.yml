name: Mobile patrol core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Kotlin core
        working-directory: mobile
        run: sh gradlew test --no-daemon
      - name: Run replay scenarios
        working-directory: mobile
        run: |
          for scenario in correct mismatch closed takeover blur-off; do
            sh gradlew run --args="$scenario" --no-daemon
          done
